name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
      LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          always-auth: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies (Tauri / GTK / WebKit)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libjavascriptcoregtk-4.0-dev \
            libsoup2.4-dev
      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Use an npm automation token if your account has 2FA enabled.
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          npm config set registry "https://registry.npmjs.org/"
          npm config set always-auth true
      - name: Install JS deps
        run: pnpm install
      - name: Build JS packages
        run: pnpm build
      - name: Verify npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Verifying npm authentication..."
          npm whoami || (echo "❌ NPM authentication failed. Check your NPM_TOKEN secret." && exit 1)
          echo "✅ NPM authentication successful"
      - name: Publish core to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/core
          echo "Publishing @meacore/tauri-easy-updater..."
          pnpm publish --access public --no-git-checks || echo "⚠️ Core package may already be published"
      - name: Publish CLI to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/cli
          echo "Publishing @meacore/tauri-easy-updater-cli..."
          pnpm publish --access public --no-git-checks || echo "⚠️ CLI package may already be published"
      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd crates/tauri-easy-updater
          cargo publish
